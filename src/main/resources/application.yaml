spring:
    application:
        name: auth-service

    logging:
        level:
            com.zaxxer.hikari.HikariConfig: DEBUG

    # Spring Boot 3.1+ maneja automáticamente la conexión si detecta el compose.yaml
    docker:
        compose:
            enabled: true
            file: compose.yaml

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    datasource:
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 3000
            idle-timeout: 600000
            max-lifetime: 1800000

    # Activación de Virtual Threads (Proyecto Loom - Java 21+)
    threads:
        virtual:
            enabled: true

    jwt:
        secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
        expiration: 600000