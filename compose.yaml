services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzas-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin_finanzas
      POSTGRES_PASSWORD: secure_password_123
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: